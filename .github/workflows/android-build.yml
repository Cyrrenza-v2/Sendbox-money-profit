name: VELTRION Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund

      - name: Build web bundle
        run: npm --prefix frontend run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DERIV_APP_ID: ${{ secrets.VITE_DERIV_APP_ID }}

      - name: Initialize Android project
        run: |
          cd frontend
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          test -s frontend/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltrion-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
