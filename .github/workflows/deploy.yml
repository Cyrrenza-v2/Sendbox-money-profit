name: Deploy VELTRION to GitHub Pages
# Manual redeploy checkpoint: 2026-10-03 — terminal verification requested.
# Manual deployment trigger: 2026-10-03 — user requested deploy and verify.
# Deployment verification: MT5 bridge v30 protected integration.
# Live terminal verification deployment checkpoint: 2026-10-06T18:04:56.728Z.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run repository tests
        run: npm test
      - name: Run frontend build verification
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -s dist/assets/index-*.js
          test -s dist/assets/index-*.css

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build VELTRION
        working-directory: frontend
        run: npm run build

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          test -s frontend/dist/assets/index-*.js
          test -s frontend/dist/assets/index-*.css
          cp frontend/dist/index.html frontend/dist/404.html
          grep -q '/assets/' frontend/dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4\n
  live-smoke:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Pages is live
        shell: bash
        run: |
          set -euo pipefail
          URL="https://cyrrenza-v2.github.io/Sendbox-money-profit/"
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -L -sS -o /tmp/veltrion.html -w '%{http_code}' --max-time 30 "$URL")" || status="000"
            if [ "$status" = "200" ] && grep -q "VELTRION" /tmp/veltrion.html; then
              echo "GitHub Pages live: HTTP $status"
              exit 0
            fi
            echo "Attempt $attempt: GitHub Pages not ready (HTTP $status); waiting..."
            sleep 10
          done
          echo "GitHub Pages live verification failed."
          exit 1
