name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/404.html || cp dist/index.html dist/404.html
          test -s dist/index.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltrion-frontend-dist
          path: frontend/dist
          if-no-files-found: error

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install
      - name: Syntax check backend
        run: |
          node --check local-server.js
          node --check riskEngine.js
          node --check healthMonitor.js
          node --check reconciliationWorker.js
          node --check realExecutionEngine.js
          node --check reconciliationService.js

  real-market-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify authenticated real-market reconnect safeguards
        run: |
          grep -q 'PRODUCTION_READ_ONLY_FREEZE = true' supabase/functions/trading-service/index.ts
          grep -q 'lastTickRef' frontend/src/pages/RealMT5Terminal.jsx
          grep -q 'REAL_MARKET_RECONNECTING' frontend/src/pages/RealMT5Terminal.jsx
          grep -q 'ticks' frontend/src/pages/RealMT5Terminal.jsx
          echo "REAL MARKET SAFETY STATIC CHECK: PASS"
          echo "CI trigger verification: $(date -u +%Y-%m-%dT%H:%M:%SZ)"


  market-data-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install WebSocket client
        run: npm install --no-save ws@8
      - name: Verify authoritative Deriv catalog, schedules, ticks and history
        run: |
          node --input-type=module <<'NODE'
          import { WebSocket } from 'ws';
          const endpoints = [
            'wss://api.derivws.com/trading/v1/options/ws/public',
            'wss://ws.derivws.com/websockets/v3?app_id=1089',
            'wss://ws.binaryws.com/websockets/v3'
          ];

          function openSocket(url) {
            return new Promise((resolve,reject)=>{
              const ws = new WebSocket(url, { headers: { Origin: 'https://deriv.com' } });
              const timer = setTimeout(()=>{ try{ws.close()}catch{}; reject(new Error('OPEN_TIMEOUT')); },15000);
              ws.once('open',()=>{ clearTimeout(timer); resolve(ws); });
              ws.once('error',e=>{ clearTimeout(timer); reject(e); });
            });
          }

          async function withSocket(fn) {
            let last;
            for (const endpoint of endpoints) {
              try {
                const ws = await openSocket(endpoint);
                try { return await fn(ws); }
                finally { try{ws.close()}catch{}; }
              } catch (e) { last=e; }
            }
            throw last || new Error('DERIV_WEBSOCKET_UNAVAILABLE');
          }

          function request(ws, payload, expected, timeout=15000) {
            return new Promise((resolve,reject)=>{
              const reqId = Number(payload.req_id);
              const timer = setTimeout(()=>{ cleanup(); reject(new Error('REQUEST_TIMEOUT_'+expected)); },timeout);
              const onMessage = e=>{
                let d; try{d=JSON.parse(String(e.data))}catch{return}
                if(Number(d.req_id)!==reqId && d.req_id!==undefined) return;
                if(d.error){ cleanup(); reject(new Error(d.error.message||'DERIV_ERROR')); return; }
                if(d.msg_type===expected){ cleanup(); resolve(d); }
              };
              const onClose = ()=>{ cleanup(); reject(new Error('WEBSOCKET_CLOSED')); };
              const onError = ()=>{ cleanup(); reject(new Error('WEBSOCKET_ERROR')); };
              const cleanup=()=>{
                clearTimeout(timer);
                ws.off('message',onMessage); ws.off('close',onClose); ws.off('error',onError);
              };
              ws.on('message',onMessage); ws.once('close',onClose); ws.once('error',onError);
              ws.send(JSON.stringify(payload));
            });
          }

          const active = await withSocket(ws=>request(ws,{active_symbols:'full',req_id:10001},'active_symbols'));
          const symbols = [...new Set((active.active_symbols||[]).map(x=>x.underlying_symbol).filter(Boolean))];
          if(!symbols.length) throw new Error('EMPTY_ACTIVE_SYMBOL_CATALOG');
          console.log('DERIV ACTIVE SYMBOL COUNT:',symbols.length);

          const schedules = await withSocket(ws=>request(ws,{trading_times:'today',req_id:10002},'trading_times'));
          const scheduleSymbols = new Set();
          function walk(node){
            if(!node || typeof node!=='object') return;
            if(Array.isArray(node)){ for(const x of node) walk(x); return; }
            if(Array.isArray(node.markets)){ for(const x of node.markets) walk(x); return; }
            if(Array.isArray(node.submarkets)){ for(const x of node.submarkets) walk(x); return; }
            if(Array.isArray(node.symbols)){
              for(const x of node.symbols){
                const s=x?.underlying_symbol||x?.symbol;
                if(s) scheduleSymbols.add(String(s));
              }
              return;
            }
            for(const [k,v] of Object.entries(node)){
              if(v && typeof v==='object') walk(v);
            }
          }
          walk(schedules.trading_times);
          console.log('DERIV TRADING-TIMES SYMBOL COUNT:',scheduleSymbols.size);
          const scheduleOnly=[...scheduleSymbols].filter(s=>!symbols.includes(s));
          console.log('DERIV SCHEDULE-ONLY COUNT:',scheduleOnly.length);
          if(scheduleOnly.length) console.log('SCHEDULE-ONLY SYMBOLS:',scheduleOnly.join(','));

          async function verifyAll(payloadFactory, expected, label, timeout) {
            const results=[];
            await withSocket(async ws=>{
              for(let i=0;i<symbols.length;i++){
                const symbol=symbols[i];
                try{
                  const r=await request(ws,payloadFactory(symbol,i),expected,timeout);
                  results.push({symbol,ok:true});
                }catch(e){
                  results.push({symbol,ok:false,error:String(e.message||e)});
                }
                if((i+1)%10===0 || i===symbols.length-1)
                  console.log(label+': '+(i+1)+'/'+symbols.length);
              }
            });
            const failed=results.filter(x=>!x.ok);
            console.log(label+' RESULT:',(symbols.length-failed.length)+'/'+symbols.length);
            if(failed.length) console.error(label+' FAILED:',JSON.stringify(failed));
            return failed;
          }

          const tickFailed=await verifyAll(
            (s,i)=>({ticks:s,subscribe:0,req_id:20000+i}),
            'tick','DERIV TICK VERIFICATION',12000
          );
          const historyFailed=await verifyAll(
            (s,i)=>({ticks_history:s,count:10,end:'latest',style:'ticks',req_id:30000+i}),
            'history','DERIV HISTORY VERIFICATION',15000
          );

          if(tickFailed.length || historyFailed.length){
            process.exit(1);
          }
          console.log('MARKET DATA COVERAGE: PASS');
          console.log('MARKET CATALOG: PASS — authoritative active_symbols full catalog verified');
          NODE
