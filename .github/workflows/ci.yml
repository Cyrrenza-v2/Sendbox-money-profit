name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/404.html || cp dist/index.html dist/404.html
          test -s dist/index.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltrion-frontend-dist
          path: frontend/dist
          if-no-files-found: error

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install
      - name: Syntax check backend
        run: |
          node --check local-server.js
          node --check riskEngine.js
          node --check healthMonitor.js
          node --check reconciliationWorker.js
          node --check realExecutionEngine.js
          node --check reconciliationService.js

  real-market-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify authenticated real-market reconnect safeguards
        run: |
          grep -q 'PRODUCTION_READ_ONLY_FREEZE = true' supabase/functions/trading-service/index.ts
          grep -q 'lastTickRef' frontend/src/pages/RealMT5Terminal.jsx
          grep -q 'REAL_MARKET_RECONNECTING' frontend/src/pages/RealMT5Terminal.jsx
          grep -q 'ticks' frontend/src/pages/RealMT5Terminal.jsx
          echo "REAL MARKET SAFETY STATIC CHECK: PASS"
          echo "CI trigger verification: $(date -u +%Y-%m-%dT%H:%M:%SZ)"


  market-data-verification:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify authoritative Deriv catalog, schedules, ticks and history through Supabase
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2FCyrrenza-v2%2FSendbox-money-profit" \
            | jq -r '.value')
          RESULT=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${RESPONSE}" \
            -H "Content-Type: application/json" \
            "https://qalowxnqngzsdlayqivr.supabase.co/functions/v1/market-data-ci")
          echo "${RESULT}"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, "MARKET DATA COVERAGE: NOT PASS"' <<<"${RESULT}"
          echo "MARKET DATA COVERAGE: PASS — verified through Supabase server-side Deriv WebSocket"
