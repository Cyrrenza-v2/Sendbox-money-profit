<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07110d">
  <title>VELTRION — Deriv Callback</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07110d;color:#edf5ef;font:14px system-ui,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;text-align:center}
    .card{padding:32px;border:1px solid #1d3a2c;border-radius:18px;background:#0b1711}
    b{letter-spacing:4px;font-size:24px}
    p{color:#8da297}
  </style>
</head>
<body>
  <main><div class="card"><b>VELTRION</b><p id="status">Verifying Deriv authorization…</p></div></main>
  <script>
    (async function () {
      const status = document.getElementById('status');
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      if (error) {
        status.textContent = 'Deriv authorization was not completed: ' + error;
        return;
      }
      if (!code || !state) {
        status.textContent = 'Missing Deriv authorization code or state.';
        return;
      }
      try {
        const response = await fetch('https://qalowxnqngzsdlayqivr.supabase.co/functions/v1/deriv-oauth/callback', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({code, state})
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok || !body.ok) {
          throw new Error(body.error || 'Deriv authorization could not be completed.');
        }
        status.textContent = 'Deriv account connected. Returning to VELTRION…';
        window.location.replace('https://cyrrenza-v2.github.io/Sendbox-money-profit/app/deriv/account?deriv=connected');
      } catch (e) {
        status.textContent = e.message || 'Deriv authorization failed.';
      }
    })();
  </script>
</body>
</html>
