<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#07110d"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <link rel="manifest" href="./manifest.json"/>
  <title>VELTRION</title>
  <style>
    html,body,#root{margin:0;min-height:100%;background:#07110d}
    #boot{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#123b27 0,#07110d 55%);color:#edf5ef;font:14px system-ui,sans-serif;padding:24px;box-sizing:border-box}
    #boot .card{width:min(100%,430px);padding:32px;box-sizing:border-box;border:1px solid #1d3a2c;border-radius:22px;background:rgba(11,23,17,.94);box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}
    #boot b{display:block;letter-spacing:5px;font-size:27px}
    #boot .tag{display:block;color:#8da297;margin-top:9px;letter-spacing:1.5px}
    #boot .status{display:inline-block;margin:22px 0 8px;padding:7px 11px;border:1px solid #28533d;border-radius:999px;color:#9fd3b2;font-size:11px;letter-spacing:1.2px}
    #boot p{color:#8da297;line-height:1.6;margin:8px 0 0}
  </style>
</head>
<body>
  <div id="root">
    <div id="boot">
      <div class="card">
        <b>VELTRION</b>
        <span class="tag">PRIVATE TRADING &amp; FINANCIAL CONTROL</span>
        <span class="status">SECURE ADMIN ACCESS</span>
        <p>Loading the secure VELTRION application…</p>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
